[package]
name = "aven"
version = "1.2.1"
description = "Aven: a local-first visual thinking workspace"
authors = ["Aven"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "aven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "form", "query"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
walkdir = "2"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "time", "macros"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
